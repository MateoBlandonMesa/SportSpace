name: Análisis de Sonar
on:
  push:
    branches:
      - main # Cambia esto por 'master' o el nombre de tu rama principal si es diferente

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requerido por Sonar para analizar el historial de Git

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Cambia a la versión de Node que use tu proyecto (20, 22, etc.)

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Pruebas con Cobertura
        run: npx jest --config apps/api/jest.config.ts --coverage --runInBand

      - name: Escaneo de SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.c0bdb8f74d892fb09afc73f9b232be618b5512bd }}
