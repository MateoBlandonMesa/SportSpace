sonar.organization=inug4mi
sonar.projectKey=inug4mi_sportspace1
sonar.projectName=SportSpace-API
sonar.projectVersion=1.1

sonar.sourceEncoding=UTF-8

# Mapeamos las fuentes y los tests para ambos entornos (API y WEB) separados por comas
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/src,apps/web/src
sonar.test.inclusions=apps/api/src/**/*.spec.ts,apps/api/src/**/*.test.ts,apps/web/src/**/*.spec.ts,apps/web/src/**/*.test.ts

# Indicamos las rutas de los archivos de configuración de TypeScript si aplican
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json

# --- LA CORRECCIÓN CLAVE: LEER AMBOS REPORTES DE COBERTURA ---
sonar.typescript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info

# --- EXCLUSIONES ABSOLUTAS (Evita que session.spec.ts cuente como código sin probar) ---
sonar.coverage.exclusions=apps/api/src/main.ts,apps/api/src/**/*.module.ts,apps/api/src/**/*.dto.ts,apps/api/src/**/*.controller.ts,apps/web/src/**/*.spec.ts,apps/web/src/**/*.test.ts

# Exclusiones generales del árbol de análisis
sonar.exclusions=**/node_modules/**,apps/api/src/**/*.spec.ts,apps/api/src/**/*.test.ts,apps/web/src/**/*.spec.ts,apps/web/src/**/*.test.ts,apps/api/coverage/**,apps/web/coverage/**,**/*.spec.ts,**/*.test.ts
